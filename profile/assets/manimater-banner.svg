<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="t">
  <title id="t">Manimater: any concept, one video away</title>
  <style>
    .wave { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 6s cubic-bezier(.22,1,.36,1) infinite; }
    .radius { transform-box: view-box; transform-origin: 790px 160px; animation: turn 6s linear infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1; } 70% { stroke-dashoffset: 0; opacity: 1; } 92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes turn { to { transform: rotate(-1080deg); } }
    @media (prefers-reduced-motion: reduce) { .wave { animation: none; stroke-dashoffset: 0; } .radius { animation: none; } }
  </style>
  <rect width="1200" height="320" rx="28" fill="#000"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="27.5" stroke="#fff" stroke-opacity=".14"/>

  <!-- the Manimater mark, from web/public/logo.svg -->
  <g transform="translate(96 88) scale(2.25)">
    <rect width="64" height="64" rx="18" fill="#fff"/>
    <g stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="19" cy="32" r="10"/>
      <path d="M19 32H29C33.73 21.33 37.27 21.33 42 32C46.73 42.67 50.27 42.67 55 32"/>
    </g>
  </g>

  <g font-family="Geist, 'Geist Sans', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#fff">
    <text x="276" y="150" font-size="72" font-weight="600" letter-spacing="-3.5">manimater</text>
    <text x="278" y="200" font-size="30" font-weight="400" fill="#a1a1a1" letter-spacing="-0.4">Any concept. One video away.</text>
  </g>
  <g font-family="'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6b6b6b">
    <text x="278" y="246">prompt in, narrated explainer out</text>
  </g>

  <!-- the signal being drawn: a phasor turning into a sine wave, in the one accent colour -->
  <line x1="740" y1="160" x2="1140" y2="160" stroke="#fff" stroke-opacity=".12"/>
  <circle cx="790" cy="160" r="36" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
  <g class="radius"><line x1="790" y1="160" x2="826" y2="160" stroke="#58c4dd" stroke-width="3" stroke-linecap="round"/></g>
